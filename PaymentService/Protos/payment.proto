syntax = "proto3";

option csharp_namespace = "PaymentService.Protos";

package payment;

service Payment {
  // Starts a Stripe subscription for a user.
  rpc TryMakeSubscription (TryMakeSubscriptionRequest) returns (TryMakeSubscriptionResponse);

  // Cancels a subscription started by TryMakeSubscription.
  rpc StopSubscription (StopSubscriptionRequest) returns (StopSubscriptionResponse);
}

message TryMakeSubscriptionRequest {
  string user_id = 1;          // Guid
  string stripe_price_id = 2;
  string service_id = 3;       // e.g. "wordpress"
  string payment_method_id = 4;  // card to charge (must belong to the user); empty = default / latest card
}

message TryMakeSubscriptionResponse {
  string stripe_subscription_id = 1;  // set when status is "SUCCESSFUL"
  string status = 2;                  // "SUCCESSFUL" or "FAILED" (declined / no card); infra errors are gRPC errors
  string reason = 3;                  // why it failed, safe to show the user
}

message StopSubscriptionRequest {
  string stripe_subscription_id = 1;
}

message StopSubscriptionResponse {
  string status = 1;           // "SUCCESSFUL" on success
}
